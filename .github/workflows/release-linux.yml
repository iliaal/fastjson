name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (arm64) at the PHP versions in
# the matrix (NTS only -- ZTS lives in the Windows lane), uploads each
# as a release asset via php/pie-ext-binary-builder using PIE's
# pre-packaged-binary naming convention.
#
# PHP 8.1-8.3 are intentionally absent: PIE's composer-default fallback
# source-builds for any PHP version not covered by a prebuilt, so those
# users still get an install path; it just needs a build toolchain. The
# Windows lane ships all of 8.1-8.5 because php-windows-builder makes the
# extra versions nearly free; the glibc/macOS lanes follow the
# established sibling convention (phpser, fastchart) of shipping only the
# current PHP versions. Drop the 8.4 lane when 8.4 hits EOL.
#
# macOS Intel (macos-13) is intentionally absent -- GitHub's Intel
# runner pool is too contended to ship reliably, and macOS 26 drops
# Intel support anyway. Intel-Mac users source-build via the fallback.
#
# Linux musl (Alpine) is intentionally absent -- shivammathur/setup-php
# in Alpine containers needs more setup, and Alpine users get install via
# PIE's composer-default source-build fallback in the meantime.
#
# yyjson is vendored (C99, no external deps), so there is no static-codec
# step here -- the produced .so links only libc/libm/libz, portable
# across glibc distros without extra work.
#
# workflow_dispatch (release_tag input) lets a maintainer build + upload
# prebuilts for an already-published release -- e.g. to backfill a tag
# cut before this workflow existed, without re-publishing the release
# (which would needlessly re-run the Windows lane). The upload target is
# the dispatch input on manual runs and the event tag on release runs.
#
# composer.json declares:
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when
# no asset matches.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload prebuilt binaries for (e.g. 0.4.0)'
        required: true

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # Uploads binary assets to the selected release.
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-14 (Apple Silicon arm64). Pinned over `*-latest` to
        # avoid silent runner shifts that would change the toolchain /
        # glibc baseline on published release assets without a repo
        # diff.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-14
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Verify release checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_tag=$(git describe --tags --exact-match)
          test "$checked_out_tag" = "$RELEASE_TAG"
          source_version=$(sed -n 's/^#define PHP_FASTJSON_VERSION "\([^"]*\)"/\1/p' php_fastjson.h)
          test "$source_version" = "${RELEASE_TAG#v}"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          phpize
          ./configure --enable-fastjson
          # Same compiler-only bar as the tests.yml jobs: 'ld: warning:'
          # lines are macOS linker deprecation notices, not compiler
          # output. A warning fails the release before any binary is
          # uploaded. pipefail keeps a failing `make` from being
          # swallowed by the tee pipe (GitHub's default shell does not
          # set pipefail). nproc covers Linux, sysctl covers macOS.
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" 2>&1 | tee build.log
          if grep 'warning:' build.log | grep -v '^ld: warning:' | grep -q .; then
            echo "::error::Build produced warning(s)"
            grep 'warning:' build.log | grep -v '^ld: warning:' || true
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          # Same gate as the tests.yml jobs: extension load guard plus
          # run-tests with FAIL,BORK,LEAK,XLEAK checks, on the release
          # checkout, before any prebuilt binary is uploaded. -uo
          # pipefail but not -e: the explicit checks below own failure
          # detection, and -e would abort the tee'd run-tests pipeline
          # before they run when run-tests exits non-zero.
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          # A bad module ABI loads no extension, so every PHPT SKIPs and
          # the summary reports 0 failures -- a green run that tested
          # nothing. Fail fast unless the extension actually loaded.
          # Capture first, then match: piping `php -m` straight into
          # `grep -q` lets grep close the pipe on the first hit, SIGPIPEs
          # php, and trips pipefail.
          mods=$(php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load"; exit 1; }
          # tee (not $(...)) so the run-tests summary and diffs are always
          # visible: under set -e a `RESULT=$(...)` assignment aborts before
          # echo when run-tests exits non-zero, hiding which test failed.
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiE 'Tests (failed|leaked|borked)[[:space:]]*:[[:space:]]*[1-9]' /tmp/test-output.txt; then
            echo "::error::tests failed/leaked/borked"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status"
            exit 1
          fi

      - name: Build and upload prebuilt binary
        uses: php/pie-ext-binary-builder@cbe134360897f23793f23c2edc7602261d205a25 # 0.0.4
        with:
          release-tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          configure-flags: '--enable-fastjson'
