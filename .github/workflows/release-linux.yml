name: Release Linux & macOS binaries

# Triggered when a GitHub Release is published. Builds .so binaries for
# Linux glibc (x86_64 + arm64) and macOS (arm64) at the PHP versions in
# the matrix (NTS only; ZTS ships in the Windows lane), gates them, and
# uploads them as release assets using PIE's pre-packaged-binary naming
# convention. Assets upload only after every build and gate passes.
#
# PHP 8.1-8.3 have no prebuilts: PIE's composer-default fallback
# source-builds them. Windows ships 8.1-8.5 because php-windows-builder
# makes extra versions cheap; glibc/macOS ship only current PHP versions,
# like phpser and fastchart. Drop the 8.4 lane when 8.4 hits EOL.
#
# Each lane compiles against the oldest patch release of its minor, built
# from the checksum-pinned php.net tarball. Patch releases add ZEND_API
# functions and call them from inline header code (8.4.27 and 8.5.12 route
# smart_str_alloc() through smart_str_ferealloc()), so a module built
# against newer headers imports symbols an older patch does not export and
# dies with "undefined symbol". 8.4.1 is the oldest 8.4: 8.4.0 was never
# released. Source builds are unaffected; they compile against the PHP
# they load into. The test suite runs the shipped module on setup-php's
# current patch, as before; the Linux gate also loads it on the oldest and
# a pinned newest patch image, and macOS loads it on the oldest-patch build
# PHP and on setup-php's.
#
# No macOS Intel (macos-13): GitHub's Intel runner pool is too contended
# to ship reliably, and macOS 26 drops Intel. Intel Macs source-build.
#
# No Linux musl (Alpine): shivammathur/setup-php needs extra setup in
# Alpine containers. Alpine users source-build via the PIE fallback.
#
# yyjson is vendored (C99, no external deps), so the .so links only
# libc/libm/libz and is portable across glibc distros.
#
# workflow_dispatch (release_tag input) builds and gates prebuilts for an
# already-published release without re-publishing it, which would re-run
# the Windows lane. With upload unchecked it runs the builds and gates
# only. The upload target is the dispatch input on manual runs and the
# event tag on release runs.
#
# composer.json declares:
#   "download-url-method": ["pre-packaged-binary", "composer-default"]
# so PIE prefers the prebuilt asset and falls back to source-build when
# no asset matches.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and upload prebuilt binaries for (e.g. 0.4.0)'
        required: true
      upload:
        description: 'Upload the gated binaries to the release (unchecked: build and gate only)'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-linux-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }} php ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 (x86_64), ubuntu-24.04-arm (arm64),
        # macos-15 (Apple Silicon arm64). Pinned over `*-latest` so the
        # toolchain and glibc baseline of release assets change only with
        # a repo diff. The macOS binaries need macOS 15 or later.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
        php: ['8.4', '8.5']
        # php-src: the oldest patch release of the minor, which the
        # binaries are built against. Hashes are the php.net-published
        # tar.xz SHA-256s. oldest-image/newest-image: official images the
        # Linux gate loads each binary on, pinned by index digest. Move
        # newest-image to each new patch release.
        include:
          - php: '8.4'
            php-src: '8.4.1'
            php-src-sha256: 94c8a4fd419d45748951fa6d73bd55f6bdf0adaefb8814880a67baa66027311f
            oldest-image: php:8.4.1-cli@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
            newest-image: php:8.4.27-cli@sha256:debadc2e36b857657846e2e952cbaf52702e55482dd3c2c43806f68d8c534a70
          - php: '8.5'
            php-src: '8.5.0'
            php-src-sha256: 39cb6e4acd679b574d3d3276f148213e935fc25f90403eb84fb1b836a806ef1e
            oldest-image: php:8.5.0-cli@sha256:fb551f94cba4698612c90158aa7d4fe8e1a5355f9c444d0f90929d366fc75b36
            newest-image: php:8.5.12-cli@sha256:635a4b998025ab269194639a5549c6fdcd9b4f88ec8cd761b092de8653d40663
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Verify release checkout
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_tag=$(git describe --tags --exact-match)
          test "$checked_out_tag" = "$RELEASE_TAG"
          source_version=$(sed -n 's/^#define PHP_FASTJSON_VERSION "\([^"]*\)"/\1/p' php_fastjson.h)
          test "$source_version" = "${RELEASE_TAG#v}"

      # Checked out from the release tag, so the gate scripts come from the
      # workflow's own commit, not from the source under release.
      - name: Check out gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-gate
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      # Kept off PATH: phpize and php-config are called by absolute path,
      # and `php` stays setup-php's for the test suite.
      - name: Build PHP ${{ matrix.php-src }} headers and binary
        env:
          PHP_SRC: ${{ matrix.php-src }}
          PHP_SRC_SHA256: ${{ matrix.php-src-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/php-$PHP_SRC.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" "https://www.php.net/distributions/php-$PHP_SRC.tar.xz"
          echo "$PHP_SRC_SHA256  $tarball" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/php-src"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/php-src" --strip-components=1
          cd "$RUNNER_TEMP/php-src"
          # The test suite needs only always-enabled extensions (json,
          # pcre, spl, date, standard, random).
          ./configure --prefix="$RUNNER_TEMP/php" --disable-all --enable-cli \
            --disable-cgi --disable-phpdbg --without-pear >"$RUNNER_TEMP/php-configure.log"
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >"$RUNNER_TEMP/php-make.log" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/php-make.log"; exit 1; }
          make install >/dev/null

      - name: Verify build and test PHP
        env:
          PHP_SRC: ${{ matrix.php-src }}
          PHP_MINOR: ${{ matrix.php }}
        shell: bash
        run: |
          set -euo pipefail
          build_php="$RUNNER_TEMP/php/bin"
          test "$("$build_php/php-config" --version)" = "$PHP_SRC"
          test "$("$build_php/php" -n -r 'echo PHP_VERSION;')" = "$PHP_SRC"
          test "$("$build_php/php" -n -r 'echo (int) PHP_ZTS, (int) PHP_DEBUG;')" = "00"
          test "$(php -n -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_MINOR"
          test "$(php -n -r 'echo (int) PHP_ZTS, (int) PHP_DEBUG;')" = "00"
          echo "build PHP $PHP_SRC; test PHP $(php -n -r 'echo PHP_VERSION;') at $(command -v php)"

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/php/bin/phpize"
          ./configure --enable-fastjson --with-php-config="$RUNNER_TEMP/php/bin/php-config"
          # Same warning gate as tests.yml ('ld: warning:' lines are macOS
          # linker notices). pipefail keeps tee from swallowing a failing
          # `make`. nproc covers Linux, sysctl covers macOS.
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)" 2>&1 | tee build.log
          # Drain the pipeline so SIGPIPE cannot hide warnings under pipefail.
          if grep 'warning:' build.log | grep -v '^ld: warning:' | grep . >/dev/null; then
            echo "::error::Build produced warning(s)"
            grep 'warning:' build.log | grep -v '^ld: warning:' || true
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          # Same test gate as tests.yml, run on the release checkout before
          # any upload. No -e: it would abort on run-tests' non-zero exit
          # before the checks below run.
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          # A bad module ABI loads no extension, so every PHPT skips and the
          # run reports 0 failures. Capture `php -m` before matching: piping
          # it into `grep -q` SIGPIPEs php on the first hit.
          mods=$(php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load"; exit 1; }
          # tee rather than $(...) keeps the summary and diffs visible when
          # run-tests exits non-zero.
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiE 'Tests (failed|leaked|borked)[[:space:]]*:[[:space:]]*[1-9]' /tmp/test-output.txt; then
            echo "::error::tests failed/leaked/borked"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status"
            exit 1
          fi

      - name: Package binary
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # php/pie-ext-binary-builder's naming:
          # php_<ext>-<tag>_php<X.Y>-<arch>-<os>-<libc>[-debug][-zts].zip
          build_php="$RUNNER_TEMP/php/bin"
          minor=$("$build_php/php-config" --version | cut -d. -f1,2)
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          case "$(uname -s)" in
            Linux) os=linux; libc=glibc ;;
            Darwin) os=darwin; libc=bsdlibc ;;
            *) echo "::error::unsupported OS $(uname -s)"; exit 1 ;;
          esac
          suffix=$("$build_php/php" -n -r "echo PHP_DEBUG ? '-debug' : '', ZEND_THREAD_SAFE ? '-zts' : '';")
          name="php_fastjson-${RELEASE_TAG}_php${minor}-${arch}-${os}-${libc}${suffix}.zip"
          mkdir -p "$RUNNER_TEMP/dist"
          zip -j "$RUNNER_TEMP/dist/$name" modules/fastjson.so
          mkdir "$RUNNER_TEMP/packaged"
          unzip -q "$RUNNER_TEMP/dist/$name" -d "$RUNNER_TEMP/packaged"
          test -f "$RUNNER_TEMP/packaged/fastjson.so"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The build PHP is the oldest patch of the minor, so loading the
      # packaged module into it and into setup-php's current patch covers
      # both ends. nm cannot attribute imports here: the module uses flat
      # namespace lookup and the system libraries live in the dyld cache.
      - name: Gate on the oldest and newest patch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # GitHub runs bash with -e; a failed load must still print its
          # output and fall through to the status checks.
          set +e
          set -uo pipefail
          module="$RUNNER_TEMP/packaged/fastjson.so"
          status=0
          for php_bin in "$RUNNER_TEMP/php/bin/php" "$(command -v php)"; do
            want=$("$php_bin" -n -r 'echo PHP_VERSION;')
            echo "== load and smoke on $php_bin (PHP $want)"
            out=$("$php_bin" -n -d extension="$module" .release-gate/scripts/prebuilt-abi-smoke.php 2>&1)
            rc=$?
            printf '%s\n' "$out"
            if [[ $rc -ne 0 ]]; then
              echo "::error::smoke on PHP $want exited with status $rc"
              status=1
            elif grep -qiE 'symbol not found|undefined symbol' <<< "$out"; then
              echo "::error::smoke on PHP $want reported an unresolved symbol"
              status=1
            elif ! grep -qF "ok php=$want " <<< "$out"; then
              echo "::error::smoke on PHP $want did not report PHP $want"
              status=1
            fi
          done
          exit "$status"

      - name: Gate on the oldest and newest patch (Linux)
        if: runner.os == 'Linux'
        env:
          OLDEST_IMAGE: ${{ matrix.oldest-image }}
          NEWEST_IMAGE: ${{ matrix.newest-image }}
        run: |
          .release-gate/scripts/prebuilt-abi-smoke.sh \
            "$RUNNER_TEMP/packaged/fastjson.so" "$OLDEST_IMAGE" "$NEWEST_IMAGE"

      - name: Store gated binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.os }}-php${{ matrix.php }}
          path: ${{ runner.temp }}/dist/${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload release assets
    needs: build
    if: github.event_name == 'release' || inputs.upload
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Uploads binary assets to the selected release.
    steps:
      - name: Fetch gated binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilt-*
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::no gated binaries to upload"
            exit 1
          fi
          printf '%s\n' "${assets[@]}"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
