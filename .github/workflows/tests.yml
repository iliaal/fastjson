name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict
      - run: scripts/check-project-metadata.sh
      - run: scripts/verify-yyjson-patches.sh

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PIE install, load, and function smoke
        run: docker run --rm -v "$PWD:/fastjson:ro" php:8.4-cli bash /fastjson/scripts/pie-smoke.sh

  linux:
    name: PHP ${{ matrix.php }} - Linux ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        arch: [x86_64]
        # 8.6 builds from the PHP-8.6 branch in the linux-php86 job:
        # setup-php's '8.6' resolves to a master snapshot, not the branch.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        # release-linux.yml ships arm64 glibc binaries for 8.4 and 8.5.
        # Build those cells here so a break shows up before the tag rather
        # than in the release workflow, where it silently drops the asset.
        # Only the shipped versions: arm64 runners are free on public repos
        # but not free of queue time, and the C is arch-sensitive in exactly
        # two places (SWAR word scans and the encode threshold tuning).
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
            php: '8.4'
          - os: ubuntu-24.04-arm
            arch: arm64
            php: '8.5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          phpize
          ./configure --enable-fastjson
          # GitHub's default shell does not set pipefail; without it a failing
          # `make` is swallowed by tee and the tests merely skip.
          make -j"$(nproc)" 2>&1 | tee build.log
          # 'ld: warning:' lines are macOS linker deprecation notices
          # (-single_module, -undefined suppress), not compiler output;
          # only compiler warnings fail the build.
          if grep 'warning:' build.log | grep -v '^ld: warning:' | grep -q .; then
            echo "::error::Build produced warning(s)"
            grep 'warning:' build.log | grep -v '^ld: warning:' || true
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          # No -e: it would abort on run-tests' non-zero exit before the
          # checks below print the summary.
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          # A bad module ABI loads no extension, so every PHPT skips and the run
          # reports 0 failures. Capture `php -m` before matching: piping it into
          # `grep -q` SIGPIPEs php on the first hit and trips pipefail.
          mods=$(php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load"; exit 1; }
          # tee rather than $(...) keeps the summary and diffs visible when
          # run-tests exits non-zero.
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiE 'Tests (failed|leaked|borked)[[:space:]]*:[[:space:]]*[1-9]' /tmp/test-output.txt; then
            echo "::error::tests failed/leaked/borked"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status"
            exit 1
          fi

  linux-php86:
    # Pre-release: gate on the PHP-8.6 branch here without publishing
    # release binaries until PHP declares 8.6 stable.
    name: PHP 8.6 - Linux x86_64 (PHP-8.6 branch)
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y re2c bison autoconf

      - name: Build PHP from the PHP-8.6 branch
        run: |
          set -euo pipefail
          git clone --depth=1 --branch=PHP-8.6 https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          git log -1 --format='php-src PHP-8.6 at %H (%cs)'
          ./buildconf --force
          ./configure \
            --disable-debug \
            --disable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-86 \
            || { echo "==== config.log tail ===="; tail -200 config.log; exit 1; }
          make -j"$(nproc)"
          make install
          /tmp/php-86/bin/php -v

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/php-86/bin:$PATH"
          phpize
          ./configure --enable-fastjson --with-php-config=/tmp/php-86/bin/php-config
          make -j"$(nproc)" 2>&1 | tee build.log
          if grep 'warning:' build.log | grep -v '^ld: warning:' | grep -q .; then
            echo "::error::Build produced warning(s)"
            grep 'warning:' build.log | grep -v '^ld: warning:' || true
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=/tmp/php-86/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          mods=$(/tmp/php-86/bin/php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load"; exit 1; }
          /tmp/php-86/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiE 'Tests (failed|leaked|borked)[[:space:]]*:[[:space:]]*[1-9]' /tmp/test-output.txt; then
            echo "::error::tests failed/leaked/borked"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status"
            exit 1
          fi

  macos:
    name: PHP ${{ matrix.php }} - macOS
    needs: validate
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirror the PHP versions release-linux.yml ships macOS binaries for
        # (8.4, 8.5). A version this job omits is a cell that first gets built
        # after the tag, when the release workflow runs, and a failure there
        # publishes a release with that platform's assets missing.
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        shell: bash
        run: |
          set -euo pipefail
          phpize
          ./configure --enable-fastjson
          make -j$(sysctl -n hw.ncpu) 2>&1 | tee build.log
          # Same compiler-only bar as Linux: 'ld: warning:' lines are
          # macOS linker deprecation notices, not compiler output.
          if grep 'warning:' build.log | grep -v '^ld: warning:' | grep -q .; then
            echo "::error::Build produced warning(s)"
            grep 'warning:' build.log | grep -v '^ld: warning:' || true
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          # No -e: it would abort on run-tests' non-zero exit before the
          # checks below print the summary.
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          # A bad module ABI loads no extension, so every PHPT skips and the run
          # reports 0 failures. Capture `php -m` before matching: piping it into
          # `grep -q` SIGPIPEs php on the first hit and trips pipefail.
          mods=$(php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load"; exit 1; }
          # tee rather than $(...) keeps the summary and diffs visible when
          # run-tests exits non-zero.
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiE 'Tests (failed|leaked|borked)[[:space:]]*:[[:space:]]*[1-9]' /tmp/test-output.txt; then
            echo "::error::tests failed/leaked/borked"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status"
            exit 1
          fi

  asan:
    name: PHP ${{ matrix.php }} - ASAN
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor-to-tip range: memory-safety bugs (recursion guards,
        # retval_stash UAF, hooked-property paths) are version-sensitive,
        # so sanitize every supported PHP, not just the newest. 8.1/8.2
        # cover the zend_call_stack_overflowed fallback boundary (8.3+).
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

    env:
      # detect_leaks=1 matches LSan's Linux default; pinning it keeps a
      # future ASAN_OPTIONS edit from flipping it. Suppress known-good
      # leaks narrowly in .github/lsan-suppressions.txt instead of
      # setting detect_leaks=0. See ~/ai/wiki/debugging/asan-php-extension.md.
      ASAN_OPTIONS: exitcode=139:verify_asan_link_order=0:detect_odr_violation=0:detect_leaks=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      USE_TRACKED_ALLOC: 1
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm clang re2c bison autoconf

      - name: Configure runtime for ASAN
        # Two GitHub-runner-specific gotchas that turn the configure
        # step into "cannot run C compiled programs":
        #
        # 1. -shared-libasan links the asan runtime as a separate .so so
        #    that __cxa_throw stays resolvable across dlopen(); without
        #    LD_LIBRARY_PATH pointing at clang's resource dir, every
        #    asan-instrumented binary fails at startup with
        #    "error while loading shared libraries: libclang_rt.asan-*.so".
        #
        # 2. Recent Ubuntu kernels default to 32-bit mmap entropy, which
        #    collides with ASAN's shadow-memory layout. Knocking
        #    vm.mmap_rnd_bits down to 28 puts it back in range.
        run: |
          ASAN_LIB_DIR=$(clang -print-resource-dir)/lib/linux
          echo "LD_LIBRARY_PATH=$ASAN_LIB_DIR" >>"$GITHUB_ENV"
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build PHP with ASAN (-shared-libasan keeps __cxa_throw resolvable across dlopen)
        run: |
          git clone --depth=1 --branch="PHP-${PHP_VERSION}" https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-debug \
            --disable-zts \
            --disable-all \
            --enable-cli \
            --prefix=/tmp/php-asan \
            || { echo "==== config.log tail ===="; tail -200 config.log; exit 1; }
          make -j$(nproc)
          make install

      - name: Build extension with ASAN
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          CXXFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure \
            --enable-fastjson \
            --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run tests under ASAN
        shell: bash
        run: |
          set -uo pipefail
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/fastjson.so"
          export NO_INTERACTION=1
          mods=$(/tmp/php-asan/bin/php $TEST_PHP_ARGS -m)
          grep -qix fastjson <<< "$mods" \
            || { echo "::error::fastjson extension failed to load under ASAN"; exit 1; }
          # Check the exit status, the presence of a summary, and the leak and
          # bork counts separately; an ASAN abort can leave any one of them clean.
          /tmp/php-asan/bin/php run-tests.php --show-diff --asan -g FAIL,BORK,LEAK,XLEAK \
              tests/ tests/upstream-json/ 2>&1 | tee /tmp/test-output.txt
          run_status=${PIPESTATUS[0]}
          if ! grep -q 'Number of tests' /tmp/test-output.txt; then
            echo "::error::run-tests.php produced no summary under ASAN (aborted?), status $run_status"
            exit 1
          fi
          if grep -qiP 'Tests (failed|leaked|borked)\s*:\s*[1-9]' /tmp/test-output.txt; then
            echo "::error::Tests failed/leaked/borked under ASAN"
            exit 1
          fi
          if [ "$run_status" -ne 0 ]; then
            echo "::error::run-tests.php exited with status $run_status under ASAN"
            exit 1
          fi
